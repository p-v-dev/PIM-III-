<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduQuest — Quiz</title>
<link rel="stylesheet" href="../assets/css/global.css">
<link rel="stylesheet" href="../assets/css/aluno.css">
</head>
<body>
<!-- ===================== QUIZ ===================== -->
<div id="screen-quiz" class="screen active">
  <div class="quiz-topbar">
    <button class="btn-back-quiz" onclick="goToHome()">&lt; Voltar</button>
    <div class="quiz-title-box" id="quiz-title-box">Análise e Desenvolvimento<br>de Sistemas</div>
    <div class="level-badge easy" id="level-badge-display">Nível Fácil</div>
  </div>
  <div class="quiz-content">
    <div class="quiz-card">
      <div class="question-counter">Questão <strong id="q-current">1</strong>/<span id="q-total">5</span></div>
      <div class="question-text" id="q-text"></div>
      <div class="options-list" id="q-options"></div>
      <div class="feedback-box" id="feedback-box"></div>
      <div class="help-buttons">
        <button class="help-btn" onclick="discardTwo()"><span class="diamond-icon">💎</span> Descartar 2 alternativas: 2</button>
        <button class="help-btn" onclick="skipQuestion()"><span class="diamond-icon">💎</span> Pular questão: 5</button>
      </div>
    </div>
    <div class="quiz-bottombar">
      <button class="nav-quiz-btn" onclick="prevQuestion()">&lt; Anterior</button>
      <button class="btn-save">💾 Salvar</button>
      <button class="nav-quiz-btn primary" onclick="nextQuestion()"><strong>Próxima &gt;</strong></button>
    </div>
  </div>
</div>

<!-- ===================== RESULT ===================== -->
<div id="screen-result" class="screen">
  <div class="result-card">
    <div class="result-icon" id="result-icon">🎉</div>
    <div class="result-title" id="result-title">Atividade Concluída!</div>
    <div class="result-score" id="result-score">4/5</div>
    <div class="result-sub" id="result-sub">Você acertou 80% das questões!</div>
    <div class="result-actions">
      <button class="btn-result secondary" onclick="restartQuiz()">Tentar Novamente</button>
      <button class="btn-result primary" onclick="goToHome()">Voltar ao Início</button>
    </div>
  </div>
</div>

<!-- ===================== DROPDOWN MENU ===================== -->
<div class="dropdown-overlay" id="dropdown-overlay" onclick="closeDropdown()">
  <div class="dropdown-menu" onclick="event.stopPropagation()">
    <button class="dropdown-item" onclick="closeDropdown()"><span class="icon">👤</span> Usuário</button>
    <button class="dropdown-item" onclick="closeDropdown(); goToSettings()"><span class="icon">⚙️</span> Configurações</button>
    <button class="dropdown-item" onclick="closeDropdown()"><span class="icon">🔔</span> Notificações</button>
    <button class="dropdown-item danger" onclick="closeDropdown(); goToLogin()"><span class="icon">🚪</span> Sair</button>
  </div>
</div>

<!-- Toast notification -->
<div class="toast" id="toast">✅ Ação realizada com sucesso!</div>

<script src="../assets/js/utils.js"></script>
<script src="../assets/js/quiz.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  loadQuizState();
  startLevel(currentLevel || 'easy');
});

function goToHome() { window.location.href = 'home.html'; }
function goToSettings() { window.location.href = 'home.html'; }
function goToLogin() { window.location.href = '../index.html'; }
</script>

<!-- ===== VLibras Widget ===== -->
<div vw class="enabled">
  <div vw-access-button class="active"></div>
  <div vw-plugin-wrapper>
    <div class="vw-plugin-top-wrapper"></div>
  </div>
</div>
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>new window.VLibras.Widget('https://vlibras.gov.br/app');</script>
</body>
</html>
